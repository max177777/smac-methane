name: Quarterly data refresh

# ⚠️ DISABLED as of the SMAC-2026-DATA-TRACE switch (Aug 2026). This script and its
# schedule target the OLD data format (data/SMAC_methane_monthly.csv +
# data/SMAC_methane_by_sector.csv), which the app no longer reads — everything now
# runs on data/SMAC_ch4_summary.csv. Re-enable only after scripts/refresh_climatetrace_data.py
# is rewritten to produce that new schema (iso3, name, sector_category, total_emissions).
# The schedule trigger is commented out below; workflow_dispatch (manual run) still
# works if you want to test the old script, but it will NOT update the file the app uses.
on:
  # schedule:
  #   - cron: "0 6 1 1,4,7,10 *"
  workflow_dispatch: {}   # lets you trigger a refresh manually from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas requests

      - name: Run refresh script
        run: python scripts/refresh_climatetrace_data.py

      - name: Commit updated data if anything changed
        run: |
          git config user.name "smac-data-bot"
          git config user.email "actions@github.com"
          git add data/SMAC_methane_monthly.csv data/SMAC_methane_by_sector.csv
          git diff --cached --quiet || git commit -m "Quarterly Climate TRACE data refresh"
          git push
        # Render and Railway both auto-redeploy on every push to the connected
        # branch (same as Streamlit Community Cloud did), so no separate
        # deploy step is needed here.
